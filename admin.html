<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Joy Nail Artistry – Manage products</title>
<style>
:root{--bg:#0A0A0A;--card:#131313;--ink:#F4F1F3;--muted:#B3AEB1;--accent:#FF35B9;--soft:#FFA3DF;--soft-bg:#2A1722;--line:#2A2A2A;--ok:#2f9d6b;--bad:#FF6B8A;color-scheme:dark}
@font-face{font-family:"Manrope";src:url(fonts/manrope-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Bodoni Moda";src:url(fonts/bodoni-moda-latin-standard-normal.woff2) format("woff2");font-weight:400 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Manrope',system-ui,sans-serif}
h1,h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;margin:0 0 .4rem}
h1{font-size:1.8rem}h2{font-size:1.35rem}
main{max-width:920px;margin:0 auto;padding:1.25rem 1rem 4rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.25rem;margin-bottom:1.25rem}
.hint{color:var(--muted);font-size:.92rem;margin:.2rem 0 .8rem}
label.l{display:block;font-weight:600;margin:1rem 0 .35rem}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;padding:.75rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#1B1B1B;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:600 1rem 'Manrope',system-ui,sans-serif;border:0;border-radius:10px;padding:.75rem 1.15rem;cursor:pointer;background:var(--accent);color:#0A0A0A}
button.ghost,.chg{background:var(--soft-bg);color:var(--soft)}
button.danger{background:#2b1218;color:var(--bad)}
button.sm{padding:.45rem .8rem;font-size:.9rem}
button:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.drop{display:flex;flex-direction:column;align-items:center;gap:.3rem;text-align:center;padding:2rem 1rem;border:2px dashed #5a2a46;border-radius:16px;background:var(--soft-bg);color:var(--soft);cursor:pointer}
.drop b{font-size:1.2rem}.drop span{color:var(--muted);font-size:.92rem}
.drop.over{border-color:var(--accent);background:#3a1a2c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-top:1rem}
.pc{background:#181818;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pimg{position:relative;aspect-ratio:4/5;background:#222}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1.3rem;line-height:1}
.chg{position:absolute;left:8px;bottom:8px;padding:.4rem .8rem;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer}
.pbody{padding:.9rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.pbody h3{margin:0;font:500 1.2rem 'Bodoni Moda',serif}
.pbody p{margin:0;color:var(--muted);font-size:.93rem}
.price{font-weight:700;color:var(--soft)}
.cl{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.cd{position:relative;width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.cd button{position:absolute;top:-8px;right:-8px;width:20px;height:20px;padding:0;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.75rem;line-height:1}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid #555;display:inline-block}
input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#1B1B1B}
.st{color:var(--bad)!important;font-weight:600;min-height:1.2em}
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);padding:.8rem 1.2rem;border-radius:10px;color:#fff;font-weight:600;display:none;z-index:9}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<p id="fatal" class="card hidden" style="color:var(--bad);font-weight:600"></p>

<section id="loginView" class="card">
  <h1>Joy’s product manager</h1>
  <p class="hint">Sign in to add or change what shows on your website.</p>
  <form id="loginForm">
    <label class="l" for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label class="l" for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <label style="display:flex;gap:.5rem;align-items:center;margin-top:.6rem"><input type="checkbox" id="showPw"> Show password</label>
    <p style="margin-top:1.2rem"><button type="submit" id="loginBtn">Sign in</button></p>
    <p id="loginErr" role="alert" style="color:var(--bad);font-weight:600;min-height:1.4em;margin:.8rem 0 0"></p>
  </form>
</section>

<div id="adminView" class="hidden">
  <header><h1>Your products</h1><button class="ghost" id="logoutBtn" type="button">Sign out</button></header>

  <section class="card">
    <h2>Add new products</h2>
    <p class="hint">Add your photos, then fill in a name, price and colors for each one. When you’re ready, tap Save.</p>
    <label class="drop" id="drop" for="pick"><b>＋ Add photos</b><span>Tap to choose, or drop photos here. You can add as many as you like.</span></label>
    <input id="pick" type="file" accept="image/*" multiple hidden>
    <div class="grid" id="queue"></div>
    <div id="saveAllRow" class="hidden" style="margin-top:1.2rem"><button id="saveAll" type="button">Save product</button></div>
  </section>

  <section class="card">
    <h2>On your website now</h2>
    <div class="grid" id="list"><p class="hint">Loading…</p></div>
  </section>
</div>
</main>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://wskkrtcpufceolkvcovt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MLVLmaj2U_ta_9-lIRNQSg_vLMzesUp';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.style.background=bad?'#b3261e':'var(--ok)'; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',3500); }
function fatal(msg){ const f=$('fatal'); f.textContent=msg; f.classList.remove('hidden'); }
let sb;
if (typeof supabase === 'undefined') fatal('Could not load the login system. Check your internet and refresh the page.');
else { try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { fatal('Setup problem: ' + e.message); } }

let queue = [], products = [], ed = null, uid = 0;
const EDIT_FOOT = '<div class="row"><button type="button" data-act="saveed">Save changes</button><button type="button" class="ghost" data-act="cancel">Cancel</button></div>';

/* ---------- auth ---------- */
async function showView(){
  try {
    const { data:{ session } } = await sb.auth.getSession();
    $('loginView').classList.toggle('hidden', !!session);
    $('adminView').classList.toggle('hidden', !session);
    if (session) loadList();
  } catch (e) { console.error(e); fatal('Login check failed: ' + e.message); }
}
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn=$('loginBtn'), err=$('loginErr'); err.textContent='';
  if (!sb) { err.textContent='The login system did not load. Refresh and try again.'; return; }
  btn.disabled=true; btn.textContent='Signing in…';
  try {
    const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
    if (error) { console.error(error); err.textContent='Could not sign in: '+error.message; } else await showView();
  } catch (ex) { console.error(ex); err.textContent='Something went wrong: '+ex.message; }
  finally { btn.disabled=false; btn.textContent='Sign in'; }
});
$('showPw').addEventListener('change', e => { $('password').type = e.target.checked ? 'text' : 'password'; });
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); showView(); });

/* ---------- photo helpers ---------- */
async function shrink(file){
  try {
    const bm = await createImageBitmap(file), r = Math.min(1, 1600/Math.max(bm.width, bm.height));
    const c = document.createElement('canvas'); c.width = Math.round(bm.width*r); c.height = Math.round(bm.height*r);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', .85));
  } catch { return file; }
}
async function upload(file){
  const blob = await shrink(file), path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const up = await sb.storage.from('product-images').upload(path, blob, { contentType: blob.type || 'image/jpeg', cacheControl:'31536000' });
  if (up.error) throw up.error;
  return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}
async function removeStored(url){
  try { const p = (url||'').split('/product-images/')[1]; if (p) await sb.storage.from('product-images').remove([decodeURIComponent(p)]); } catch (e) { console.error(e); }
}

/* ---------- drawing ---------- */
const dots = cs => cs.map((c,i) => `<span class="cd" style="background:${esc(c)}"><button type="button" data-act="rmc" data-i="${i}" aria-label="Remove color">×</button></span>`).join('');
function editor(o, extra, foot){
  return `<article class="pc" data-id="${o.id}">
    <div class="pimg">${o.preview ? `<img src="${esc(o.preview)}" alt="">` : ''}${extra}</div>
    <div class="pbody">
      <input data-f="title" type="text" maxlength="120" placeholder="Product name" aria-label="Product name" value="${esc(o.title)}">
      <textarea data-f="description" maxlength="1500" placeholder="Short description (optional)" aria-label="Description">${esc(o.description)}</textarea>
      <input data-f="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Price in ₦" aria-label="Price" value="${esc(o.price)}">
      <div class="cl">${dots(o.colors)}<input data-f="cp" type="color" value="${esc(o.cp)}" aria-label="Pick a color"><button type="button" class="ghost sm" data-act="addc">+ Add color</button></div>
      <p class="st" role="status">${esc(o.msg || '')}</p>${foot}
    </div></article>`;
}
function drawQueue(){
  $('queue').innerHTML = queue.map(o => editor(o, '<button class="x" type="button" data-act="rm" aria-label="Remove this photo">×</button>', '')).join('');
  $('saveAllRow').classList.toggle('hidden', !queue.length);
  $('saveAll').textContent = queue.length > 1 ? `Save all ${queue.length} products` : 'Save product';
}
function drawList(){
  $('list').innerHTML = products.length ? products.map(p => {
    if (ed && ed.id === p.id) return editor(ed, '<label class="chg">Change photo<input type="file" accept="image/*" data-photo hidden></label>', EDIT_FOOT);
    return `<article class="pc" data-id="${p.id}">
      <div class="pimg">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}">` : ''}</div>
      <div class="pbody"><h3>${esc(p.title)}</h3>${p.description ? `<p>${esc(p.description)}</p>` : ''}
        <div class="cl">${(p.colors||[]).map(c => `<i class="dot" style="background:${esc(c)}"></i>`).join('')}</div>
        ${p.price != null ? `<span class="price">₦${Number(p.price).toLocaleString()}</span>` : ''}
        <div class="row" style="margin-top:auto"><button class="ghost sm" type="button" data-act="edit">Edit</button><button class="danger sm" type="button" data-act="del">Delete</button></div>
      </div></article>`;
  }).join('') : '<p class="hint">No products yet. Add your first photos above.</p>';
}
async function loadList(){
  const { data, error } = await sb.from('products').select('*').order('created_at', { ascending:false });
  if (error) { console.error(error); $('list').innerHTML = '<p class="hint">Could not load products: ' + esc(error.message) + '</p>'; return; }
  products = data; drawList();
}

/* ---------- adding photos ---------- */
function addFiles(files){
  [...files].filter(f => f.type.startsWith('image/')).forEach(f => queue.push({ id:'q'+(++uid), file:f, preview:URL.createObjectURL(f), title:'', description:'', price:'', colors:[], cp:'#FF35B9', msg:'' }));
  drawQueue();
}
$('pick').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
['dragenter','dragover'].forEach(n => $('drop').addEventListener(n, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(n => $('drop').addEventListener(n, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => addFiles(e.dataTransfer.files));

/* ---------- typing, clicks ---------- */
const obj = id => queue.find(x => x.id === id) || (ed && ed.id === id ? ed : null);
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const o = obj(e.target.closest('[data-id]')?.dataset.id); if (o) o[f] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.matches && e.target.matches('[data-photo]') && ed) {
    const f = e.target.files[0]; if (f) { ed.file = f; ed.preview = URL.createObjectURL(f); drawList(); }
  }
});
const row = o => ({ title:o.title.trim(), description:o.description.trim(), price:(o.price === '' || o.price == null) ? null : parseFloat(o.price), colors:o.colors });

async function saveAll(){
  const btn = $('saveAll'); btn.disabled = true; let ok = 0;
  for (const o of [...queue]) {
    if (!o.title.trim()) { o.msg = 'Please add a name.'; drawQueue(); continue; }
    o.msg = 'Saving…'; drawQueue();
    try {
      const image_url = await upload(o.file);
      const { error } = await sb.from('products').insert({ ...row(o), image_url });
      if (error) throw error;
      queue = queue.filter(x => x !== o); ok++;
    } catch (err) { console.error(err); o.msg = 'Could not save: ' + err.message; }
    drawQueue();
  }
  btn.disabled = false;
  if (ok) { toast(ok + (ok > 1 ? ' products are' : ' product is') + ' now on your website.'); await loadList(); }
}
async function saveEdit(){
  if (!ed.title.trim()) { ed.msg = 'Please add a name.'; drawList(); return; }
  ed.msg = 'Saving…'; drawList();
  try {
    let image_url = ed.orig; if (ed.file) image_url = await upload(ed.file);
    const { error } = await sb.from('products').update({ ...row(ed), image_url }).eq('id', ed.id);
    if (error) throw error;
    if (ed.file && ed.orig) await removeStored(ed.orig);
    ed = null; toast('Saved.'); await loadList();
  } catch (err) { console.error(err); ed.msg = 'Could not save: ' + err.message; drawList(); }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.closest('[data-id]')?.dataset.id, o = obj(id);
  const redraw = () => queue.some(x => x.id === id) ? drawQueue() : drawList();
  if (act === 'rm') { queue = queue.filter(x => x.id !== id); drawQueue(); }
  else if (act === 'addc' && o) { if (!o.colors.includes(o.cp)) o.colors.push(o.cp); redraw(); }
  else if (act === 'rmc' && o) { o.colors.splice(+b.dataset.i, 1); redraw(); }
  else if (act === 'edit') {
    const p = products.find(x => x.id === id); if (!p) return;
    ed = { id:p.id, title:p.title, description:p.description || '', price:p.price, colors:[...(p.colors||[])], cp:'#FF35B9', preview:p.image_url, orig:p.image_url, file:null, msg:'' };
    drawList();
  }
  else if (act === 'cancel') { ed = null; drawList(); }
  else if (act === 'saveed' && ed) await saveEdit();
  else if (act === 'del') {
    const p = products.find(x => x.id === id); if (!p || !confirm('Delete “' + p.title + '” from your website?')) return;
    const { error } = await sb.from('products').delete().eq('id', id);
    if (error) return toast('Could not delete: ' + error.message, true);
    await removeStored(p.image_url); toast('Deleted.'); loadList();
  }
});
$('saveAll').addEventListener('click', saveAll);

if (sb) { sb.auth.onAuthStateChange(() => { setTimeout(showView, 0); }); showView(); }
</script>
</body>
</html>
